<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{% block title %}Celebrar Cestas Gourmet{% endblock %}</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/tom-select.default.css')}}">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/base_styles.css')}}">
		<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
		{% block extra_css %}{% endblock %}
	</head>
	<body class="fit-viewport">
		<header>
			<div class="brand-logo">
				<a href="{{ url_for('home_bp.home') }}">
					<img src="{{url_for('static', filename='img/Logo_Simplified.png')}}"/>
				</a>
			</div>
			<nav>
				<ul>
					<li><a
						href="{{ url_for('home_bp.home') }}"
						class="{% block nav_home %}{% endblock %}"
						>INÍCIO</a>
					</li>
					<li><a
						href="{{ url_for('clients_bp.clients') }}"
						class="{% block nav_clients %}{% endblock %}"
						>CLIENTES</a>
					</li>
					<li><a
						href="{{ url_for('catalogue_bp.catalogue') }}"
						class="{% block nav_catalogue %}{% endblock %}"
						>CATÁLOGO</a>
					</li>
					<li><a
						href="{{ url_for('storage_bp.storage') }}"
						class="{% block nav_storage %}{% endblock %}"
						>ESTOQUE</a>
					</li>
					<li><a
						href="{{ url_for('orders_bp.orders') }}"
						class="{% block nav_orders %}{% endblock %}"
						>PEDIDOS</a>
					</li>
					<li><a
						href="{{ url_for('deliveries_bp.deliveries') }}"
						class="{% block nav_deliveries %}{% endblock %}"
						>ENTREGAS</a>
					</li>
					<li><a
						href="{{ url_for('financial_bp.financial') }}"
						class="{% block nav_financial %}{% endblock %}"
						>FINANCEIRO</a>
					</li>
				</ul>
			</nav>
			<div class="user-menu">
				<button
					class="user-menu-toggle"
					type="button"
					aria-expanded="false"
					aria-controls="user-dropdown"
				>
					Olá, <strong>{{user}}!</strong> &#9662;
				</button>

				<div class="user-dropdown" id="user-dropdown">
					<form method="POST" action="{{url_for('auth_bp.logout')}}">
						<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
						<button type="submit" class="dropdown-logout">
							<svg class="door-closed" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-door-closed-fill" viewBox="0 0 16 16">
								<path d="M12 1a1 1 0 0 1 1 1v13h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V2a1 1 0 0 1 1-1zm-2 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
							</svg>
							<svg class="door-open" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-door-open-fill" viewBox="0 0 16 16">
								<path d="M1.5 15a.5.5 0 0 0 0 1h13a.5.5 0 0 0 0-1H13V2.5A1.5 1.5 0 0 0 11.5 1H11V.5a.5.5 0 0 0-.57-.495l-7 1A.5.5 0 0 0 3 1.5V15zM11 2h.5a.5.5 0 0 1 .5.5V15h-1zm-2.5 8c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"/>
							</svg>
							Sair
						</button>
					</form>
				</div>
			</div>
		</header>

		<div class="dashboard-container">
			{% block content %}{% endblock %}
		</div>

		{% block modals %}{% endblock %}
		{% block scripts %}
		<script src="{{url_for('static', filename='js/icons.js')}}"></script>
		<script src="{{url_for('static', filename='js/common.js')}}"></script>
		{% endblock %}

	</body>
</html>
