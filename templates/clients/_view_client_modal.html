<div id="viewClient-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Dados do Cliente</h3>
			<button type="button" class="btn-close" onclick="closeModal('viewClient-modal')">&times;</button>
		</div>
		<form id="viewClient-form" method="post" action="{{url_for('clients_bp.update_client')}}">
			<input type="hidden" id="viewClient-id" name="id">

			<label>Nome*:</label>
			<input type="text" id="viewClient-name" name="name" placeholder="---" disabled oninput="toggleSaveButton(['viewClient-name', 'viewClient-phone'], 'viewClient-saveBtn')">
			
			<label>Telefone:</label>
			<input type="text" inputmode="numeric" id="viewClient-phone" name="phone" placeholder="---" disabled oninput="inputPhone(this);toggleSaveButton(['viewClient-name', 'viewClient-phone'], 'viewClient-saveBtn')">
			
			<div class="modal-actions">
				<div>
					<button type="button" class="btn-modal btn-delete" id="viewClient-deleteBtn" onclick="deleteClient()">Excluir</button>
				</div>
				<div>
					<button type="button" class="btn-modal btn-edit" id="viewClient-editBtn" onclick="enableEditClient()">Editar</button>
					<button type="button" class="btn-modal btn-save" id="viewClient-saveBtn" style="display: none;" disabled onclick="submitModal('viewClient-form')">Salvar</button>
					<button type="button" class="btn-modal btn-cancel" id="viewClient-cancelBtn" style="display: none;" onclick="cancelEditClient()">Cancelar</button>
				</div>
			</div>

		</form>
	</div>
</div>
