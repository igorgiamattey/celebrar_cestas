<div id="mngCourier-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Gerenciar Entregadores</h3>
			<button type="button" class="btn-close" onclick="closeModal('mngCourier-modal')">&times;</button>
		</div>

		<label>Entregadores [selecione para editar]:</label>
		<div>
			<select id="mngCourier-courierSelect">
				<option value="">Novo Entregador</option>
				{% for courier in available_couriers %}
					<option value="{{courier.id}}">{{courier.name}}</option>
				{% endfor %}
			</select>
		</div>

		<label>Nome:</label>
		<div>
			<input type="text" id="mngCourier-name">
		</div>

		<label>Telefone:</label>
		<div>
			<input type="text" id="mngCourier-phone" oninput="inputPhone(this)">
		</div>

		<div id="mngCourier-couriersList" class="couriers-list"></div>

		<div class="modal-actions">
			<button
				type="button"
				class="btn-modal btn-save push-right"
				onclick="saveCourier()"
			>
				Salvar
			</button>
		</div>
	</div>
</div>
