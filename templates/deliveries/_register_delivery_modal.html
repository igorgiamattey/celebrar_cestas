<div id="newDelivery-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Registrar Entrega</h3>
			<button type="button" class="btn-close" onclick="closeModal('newDelivery-modal')">&times;</button>
		</div>
		<form id="newDelivery-form" method="post" action="{{url_for('deliveries_bp.new_delivery')}}">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<input type="hidden" id="newDelivery-items" name="items">
			<div class="status-row">
				<div class="form-group">
					<label>Entregador:</label>
					<input
						id="newDelivery-courier"
						name="courier"
						data-couriers='{{available_couriers|tojson}}'
						placeholder="Selecione o entregador"
					>
				</div>

				<div class="form-group">
				<label>Status:</label>
					<input
						id="newDelivery-status"
						name="status"
						data-status='{{delivery_statuses|tojson}}'
					>
				</div>
			</div>

			<div class="order-row">
				<div class="form-group">
					<label>Data de Entrega*:</label>
					<input
						id="newDelivery-date"
						name="date"
						data-dates='{{available_dates|tojson}}'
						placeholder="Selecione a data"
					>
				</div>

				<div class="form-group">
					<label>Pedido*:</label>
					<input
						id="newDelivery-orders"
						data-orders='{{available_orders|tojson}}'
						placeholder="Selecione o pedido">
				</div>

				<div class="form-group form-group--btn">
					<label>&nbsp;</label>
					<button type="button" class="btn-modal btn-edit" onclick="addOrderToDelivery('new')">
						+ Adicionar
					</button>
				</div>
			</div>

			<div id="newDelivery-orderList" class="delivery-orders-list"></div>
			
			<div class="modal-actions">
				<button
					type="button"
					id="newDelivery-saveBtn"
					class="btn-modal btn-save push-right"
					disabled
					onclick="saveNewDelivery()"
				>
					Salvar
				</button>
			</div>

		</form>
	</div>
</div>
