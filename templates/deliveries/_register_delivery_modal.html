<div id="newDelivery-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Registrar Entrega</h3>
			<button type="button" class="btn-close" onclick="closeModal('newDelivery-modal')">&times;</button>
		</div>
		<form id="newDelivery-form" method="post" action="{{url_for('orders_bp.new_order')}}">
			<input type="hidden" id="newDelivery-items" name="items">
			<input type="hidden" id="newDelivery-deliveryDetails" name="deliveryDetails">
			<div class="status-row">
				<div class="form-group">
					<label>Entregador:</label>
					<input
						id="newDelivery-courier"
						name="courier"
						data-couriers='{{available_couriers|tojson}}'
						placeholder="Selecione um entregador..."
					>
				</div>

				<div class="form-group">
				<label>Status:</label>
					<input
						id="newDelivery-status"
						name="status"
						data-status='{{statuses|tojson}}'
					>
				</div>
			</div>

			<div class="order-row">
				<div class="form-group">
					<label>Data de Entrega*:</label>
					<input
						id="newDelivery-date"
						name="date"
						data-dates='{{available_dates|tojson}}'
						placeholder="Selecione uma data para entrega..."
						oninput="
							toggleSaveButton(
								['newDelivery-date'],
								'newDelivery-saveBtn'
							)"
					>
				</div>

				<div class="form-group">
					<label>Pedido*:</label>
					<input
						id="newDelivery-orders"
						data-orders='{{available_orders|tojson}}'
						placeholder="Selecione uma pedido...">
				</div>

					<button type="button" class="btn-modal btn-edit" onclick="addOrderToDelivery('new')">
						+ Adicionar
					</button>
			</div>

			<div id="newDelivery-orderList" class="delivery-items-list"></div>
			
			<div class="modal-actions">
				<button
					type="button"
					id="newDelivery-saveBtn"
					class="btn-modal btn-save push-right"
					disabled
					onclick="saveNewDelivery()"
				>
					Salvar
				</button>
			</div>

		</form>
	</div>
</div>
