<div id="viewDelivery-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Dados da Entrega</h3>
			<button type="button" class="btn-close" onclick="closeModal('viewDelivery-modal')">&times;</button>
		</div>
		<form id="viewDelivery-form" method="post" action="{{url_for('deliveries_bp.update_delivery')}}">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
			<input type="hidden" id="viewDelivery-id" name="id">
			<input type="hidden" id="viewDelivery-items" name="items">
			<div class="status-row">
				<div class="form-group">
					<label>Entregador:</label>
					<input
						id="viewDelivery-courier"
						name="courier"
						data-couriers='{{available_couriers|tojson}}'
						placeholder="Entregador..."
					>
				</div>

				<div class="form-group">
				<label>Status:</label>
					<input
						id="viewDelivery-status"
						name="status"
						data-status='{{delivery_statuses|tojson}}'
					>
				</div>
				<div class="form-group">
					<label>Data de Entrega*:</label>
					<input
						id="viewDelivery-date"
						name="date"
						data-dates='{{available_dates|tojson}}'
						placeholder="Data..."
					>
				</div>
			</div>

			<div id="viewDelivery-addOrderRow" class="order-row" style="display: none;">
				<div class="form-group">
					<label>Pedido*:</label>
					<input
						id="viewDelivery-orders"
						data-orders='{{available_orders|tojson}}'
						placeholder="Selecione um pedido...">
				</div>

				<div class="form-group form-group--btn">
					<label>&nbsp;</label>
					<button type="button" class="btn-modal btn-edit" onclick="addOrderToDelivery('view')">
						+ Adicionar
					</button>
				</div>
			</div>

			<div id="viewDelivery-orderList" class="delivery-orders-list"></div>
			
			<div class="modal-actions" id="viewDelivery-modalActions">
				<div></div>
				<div>
					<button type="button" class="btn-modal btn-edit" id="viewDelivery-editBtn" onclick="enableEditDelivery()">Editar</button>
					<button type="button" class="btn-modal btn-save" id="viewDelivery-saveBtn" style="display: none;" disabled onclick="updateDelivery()">Salvar</button>
					<button type="button" class="btn-modal btn-cancel" id="viewDelivery-cancelBtn" style="display: none;" onclick="cancelEditDelivery()">Cancelar</button>
				</div>
			</div>

		</form>
	</div>
</div>
