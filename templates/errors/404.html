<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta
			name="viewport" content="width=device-width, initial-scale=1.0"
		>
		<meta
			name="robots"
			content="noindex"
		>
		<title>
			Página não encontrada | Celebrar Cestas Gourmet
		</title>
		<link rel="stylesheet" href="{{url_for('static', filename='css/base_styles.css')}}">
		<link rel="stylesheet" href="{{url_for('static', filename='css/error_404_styles.css')}}">
		<link rel="icon" href="{{url_for('static', filename='img/favicon.png')}}" type="image/png">
	</head>
	<body class="error-404" style="--art-img: url('{{url_for('static', filename='img/404.png')}}')">
		<main class="error-404-main" role="alert">
			<div class="error-art" aria-hidden="true">
			</div>

			<h1 class="error-title">
				<span class="visually-hidden">
					Erro 404. 
				</span>
				Essa cesta está vazia
			</h1>

			<p class="error-message">
				O endereço que você acessou não existe ou foi movido.
			</p>

			<div class="error-actions">
				<a
					class="error-btn"
					href="{{url_for('home_bp.home')}}"
				>
					Voltar ao início
				</a>
			</div>
		</main>
	</body>
</html>
