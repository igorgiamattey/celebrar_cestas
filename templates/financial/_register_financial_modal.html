<div id="newFinancial-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Cadastrar Novo Lançamento</h3>
			<button type="button" class="btn-close" onclick="closeModal('newFinancial-modal')">&times;</button>
		</div>
		<form id="newFinancial-form" method="post" action="{{url_for('financial_bp.new_financial')}}">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

			<div class="status-row">
				<div class="form-group">
					<label>Tipo*:</label>
					<input
						id="newFinancial-type"
						name="type"
						data-types='{{available_types|tojson}}'
						placeholder="Tipo de transação..."
						oninput="saveButton('new')"
					>
				</div>
				<div class="form-group">
					<label>Categoria*:</label>
					<input
						id="newFinancial-category"
						name="category"
						data-category='{{available_categories|tojson}}'
						oninput="saveButton('new')"
					>
				</div>
			</div>

			<div class="status-row">
				<div class="form-group">
					<label>Status do Pagamento*:</label>
					<input
						id="newFinancial-status"
						name="status"
						data-status='{{financial_statuses|tojson}}'
						placeholder="Status da transação..."
						oninput="saveButton('new')"
					>
				</div>
				<div class="form-group" id="newFinancial-showOrder" style="display: none;">
					<label>Pedido*:</label>
					<input
						id="newFinancial-order"
						name="order"
						data-orders='{{available_orders|tojson}}'
						placeholder="Pedido da transação..."
						oninput="saveButton('new')"
					>
				</div>
				<div class="form-group" id="newFinancial-showSupplier" style="display: none;">
					<label>Fornecedor*:</label>
					<input
						type="text"
						id="newFinancial-supplier"
						name="supplier"
						maxlength="100"
						oninput="saveButton('new')"
					>
				</div>
			</div>

			<div class="date-row">
				<div class="form-group">
					<label>Valor*:</label>
					<input
						type="text"
						id="newFinancial-value"
						name="value"
						oninput="
							inputPrice(this);
							saveButton('new');
						"
					>
				</div>
				<div class="form-group">
					<label id="newFinancial-dateLbl">Data de Pagamento:</label>
					<input
						id="newFinancial-date"
						name="date"
						type="date"
						max="{{today}}"
						onkeydown="return false"
						disabled
						oninput="saveButton('new')"
					>
				</div>
			</div>

			<label>Descrição:</label>
			<textarea
				id="newFinancial-description"
				name="description"
				rows="2"
				maxlength="150"
			></textarea>

			<div class="modal-actions">
				<button
					type="button"
					id="newFinancial-saveBtn"
					class="btn-modal btn-save push-right"
					onclick="saveNewFinancial()"
					disabled>
					Salvar
				</button>
			</div>
		</form>
	</div>
</div>
