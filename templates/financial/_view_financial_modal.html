<div id="viewFinancial-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Detalhes do Lançamento</h3>
			<button type="button" class="btn-close" onclick="closeModal('viewFinancial-modal')">&times;</button>
		</div>
		<form id="viewFinancial-form" method="post" action="{{url_for('financial_bp.update_financial')}}">
			<input type="hidden" id="viewFinancial-id" name="id">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

			<div class="status-row">
				<div class="form-group">
					<label>Tipo*:</label>
					<input
						id="viewFinancial-type"
						name="type"
						data-types='{{available_types|tojson}}'
						placeholder="Tipo de transação..."
						oninput="saveButton('view')"
					>
				</div>
				<div class="form-group">
					<label>Categoria*:</label>
					<input
						id="viewFinancial-category"
						name="category"
						data-category='{{available_categories|tojson}}'
						oninput="saveButton('view')"
					>
				</div>
			</div>

			<div class="status-row">
				<div class="form-group">
					<label>Status do Pagamento*:</label>
					<input
						id="viewFinancial-status"
						name="status"
						data-status='{{financial_statuses|tojson}}'
						placeholder="Status da transação..."
						oninput="saveButton('view')"
					>
				</div>
				<div class="form-group" id="viewFinancial-showOrder" style="display: none;">
					<label>Pedido*:</label>
					<input
						id="viewFinancial-order"
						name="order"
						data-orders='{{available_orders|tojson}}'
						placeholder="Pedido da transação..."
						oninput="saveButton('view')"
					>
				</div>
				<div class="form-group" id="viewFinancial-showSupplier" style="display: none;">
					<label>Fornecedor*:</label>
					<input
						type="text"
						id="viewFinancial-supplier"
						name="supplier"
						maxlength="100"
						oninput="saveButton('view')"
					>
				</div>
			</div>

			<div class="date-row">
				<div class="form-group">
					<label>Valor*:</label>
					<input
						type="text"
						id="viewFinancial-value"
						name="value"
						oninput="
							inputPrice(this);
							saveButton('view');
						"
					>
				</div>
				<div class="form-group">
					<label id="viewFinancial-dateLbl">Data de Pagamento:</label>
					<input
						id="viewFinancial-date"
						name="date"
						type="date"
						max="{{today}}"
						onkeydown="return false"
						disabled
						oninput="saveButton('view')"
					>
				</div>
			</div>

			<label>Descrição:</label>
			<textarea
				id="viewFinancial-description"
				name="description"
				rows="2"
				maxlength="150"
			></textarea>

			<div class="modal-actions" id="viewFinancial-modalActions">
				<div></div>
				<div>
					<button type="button" class="btn-modal btn-edit" id="viewFinancial-editBtn" onclick="enableEditFinancial()">Editar</button>
					<button type="button" class="btn-modal btn-delete" id="viewFinancial-refundBtn" style="display: none;" onclick="refundFinancial()">Estornar</button>
					<button type="button" class="btn-modal btn-save" id="viewFinancial-saveBtn" style="display: none;" disabled onclick="updateFinancial()">Salvar</button>
					<button type="button" class="btn-modal btn-cancel" id="viewFinancial-cancelBtn" style="display: none;" onclick="cancelEditFinancial()">Cancelar</button>
				</div>
			</div>
		</form>
	</div>
</div>
