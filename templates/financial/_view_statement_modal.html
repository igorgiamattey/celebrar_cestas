<div id="viewStatement-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Extrato Mensal</h3>
			<button type="button" class="btn-close" onclick="closeModal('viewStatement-modal')">&times;</button>
		</div>
		<div class="statements-list">
			{% if statement_rows|length == 0 %}
				<p class="no-movements">Nenhum lançamento registrado.</p>
			{% else %}
			<div class="table-scroll">
				<table class="statement-table">
					<tbody>
						<tr>
							<th>Mês</th>
							<th>Entradas</th>
							<th>Saídas</th>
							<th>Total</th>
						</tr>
						{% for row in statement_rows %}
							<tr>
								{% for val in row %}
								<td>{{val}}</td>
								{% endfor %}
							</tr>
						{% endfor %}
					</tbody>
				</table>
			</div>	
			{% endif %}
		</div>
	</div>
</div>
