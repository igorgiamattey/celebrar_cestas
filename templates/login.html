<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Celebrar Cestas Gourmet</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/login_styles.css')}}">
		<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
	</head>
	<body>
		<div class="container">
			<div class="logo-container">
				<div class="logo-wrapper">
					<img src="{{url_for('static', filename='img/Logo_parts/text.png')}}" class="logo-text"/>
					<img src="{{url_for('static', filename='img/Logo_parts/deco.png')}}" class="logo-deco"/>
				</div>
			</div>
			<div class="login-container">
				<div class="login-card">
					<div class="login-header">
						<h3>Seja bem-vindo!</h3>
					</div>
					{% with messages = get_flashed_messages(with_categories=true) %}
						{% if messages %}
							{% for category, message in messages %}
								<div class="flash-message {{ category }}">
									{{ message }}
								</div>
							{% endfor %}
						{% endif %}
					{% endwith %}
					<form method="POST" action="{{url_for('auth_bp.login')}}">
						<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
						<div class="input-container">
							<input
								type="text"
								name="login_id"
								id="login_id"
								placeholder="E-mail/Usuário"
								autocomplete="off"
								oninput="
									inputUserMail(this);
									toggleLoginButton(['login_id', 'password'], 'login-button');
								"
							> 
							<input
								type="password"
								name="password"
								id="password"
								placeholder="Senha"
								autocomplete="off"
								oninput="toggleLoginButton(['login_id', 'password'], 'login-button')"
							> 
							<div class="button-container">
								<button class="login-button" id="login-button" type="submit" disabled>Entrar</button> 
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<script src="{{url_for('static', filename='js/common.js')}}"></script>
		<script src="{{url_for('static', filename='js/login.js')}}"></script>
	</body>	
</html>
