<div id="basketComposition-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Escolha os Itens</h3>
			<button
				type="button"
				class="btn-close"
				onclick="cancelBasketComposition()"
			>
				&times;
			</button>
		</div>

		<div id="basketComposition-list"></div>

		<div class="modal-actions">
			<button
				type="button"
				class="btn-modal btn-save push-right"
				id="basketComposition-btn"
				onclick="confirmOrderBasket()"
			>
				Adicionar
			</button>
		</div>		
	</div>
</div>
