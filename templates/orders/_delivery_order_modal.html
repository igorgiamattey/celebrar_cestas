<div id="deliveryOrder-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Detalhes da Entrega</h3>
			<button
				type="button"
				class="btn-close"
				onclick="cancelDeliveryDetails('new')"
			>
				&times;
			</button>
		</div>

		<div class="form-group">
			<label>Endereço*:</label>
			<input
				id="newOrder-address"
				data-addresses='{{available_addresses|tojson}}'
				placeholder="Selecione um Endereço..."
			>
		</div>

		<div class="form-group" id="newOrder-newAddressRow" style="display: none;">
			<label>Novo Endereço*:</label>
			<textarea
				id="newOrder-newAddressText"
				name="newAddressText"
				rows="4"
				maxlength="200"
			></textarea>
		</div>

		<div class="price-row">
			<div class="form-group">
				<label>Taxa de Entrega*:</label>
				<input
					id="newOrder-deliveryFee"
					name="deliveryFee"
					type="text"
					oninput="inputNumber(this); updateOrderTotal('new')"
				>
			</div>

			<div class="form-group">
				<label>Total do Pedido:</label>
				<input
					id="newOrder-totalPrice"
					name="totalPrice"
					type="text"
					disabled
				>
			</div>
		</div>
		
		<input type="hidden" id="newOrder-addressId" name="addressId">
		
		<div class="modal-actions">
			<button
				type="button"
				class="btn-modal btn-save push-right"
				id="deliveryDetails-btn"
				onclick="confirmDeliveryDetails('new')"
			>
				Salvar
			</button>
		</div>		
	</div>
</div>
