<div id="newOrder-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Registrar Pedido</h3>
			<button type="button" class="btn-close" onclick="closeModal('newOrder-modal')">&times;</button>
		</div>
		<form id="newOrder-form" method="post" action="{{url_for('orders_bp.new_order')}}">
			<input type="hidden" id="newOrder-items" name="items">
			<input type="hidden" id="newOrder-deliveryDetails" name="deliveryDetails">
			<div class="client-row">
				<label>Cliente*:</label>
				<input
					id="newOrder-client"
					name="client"
					data-clients='{{available_clients|tojson}}'
					placeholder="Selecione um cliente..."
					oninput="
						toggleSwitch('newOrder-client', 'newOrder-isDelivery');
						refreshAddressOptions(this.value, 'new')
						toggleSaveButton(
							['newOrder-client', 'newOrder-orderPrice', 'newOrder-date'],
							'newOrder-saveBtn',
							[newOrderBaskets])"
				>
			</div>

			<div class="date-row">
				<div class="form-group">
					<label>Data do Pedido*:</label>
					<input
						id="newOrder-date"
						name="date"
						type="date"
						onkeydown="return false"
						max="{{ today }}"
						oninput="
						updateOrderDeliveryDate('new')
						toggleSaveButton(
							['newOrder-client', 'newOrder-orderPrice', 'newOrder-date'],
							'newOrder-saveBtn',
							[newOrderBaskets])"
					>
				</div>
				<div class="form-group">
					<label>Data de Entrega:</label>
					<input
						id="newOrder-deliveryDate"
						name="deliveryDate"
						type="date"
						onkeydown="return false"
					>
				</div>
			</div>

			<label>Adicionar Cesta*:</label>
			<div id="newOrder-addBasketRow" class="item-selection">
				<input
					id="newOrder-baskets"
					data-baskets='{{available_baskets|tojson}}'
					placeholder="Selecione uma cesta...">

				<input
					id="newOrder-basketQty"
					type="text"
					placeholder="Qtd"
					oninput="inputNumber(this)"
				>
				<button type="button" class="btn-modal btn-edit" onclick="addBasketToOrder('new')">
					+ Adicionar
				</button>
			</div>
			<div id="newOrder-basketList" class="order-items-list"></div>

			<div id="newOrder-statusRow" class="status-row">
				<div class="form-group form-group--grow">
					<label>Valor do Pedido*:</label>
					<input
						id="newOrder-orderPrice"
						name="orderPrice"
						type="text"
						oninput="
							inputNumber(this)
							toggleSaveButton(
							['newOrder-client', 'newOrder-orderPrice', 'newOrder-date'],
							'newOrder-saveBtn',
							[newOrderBaskets])"
					>
				</div>

				<div class="form-group form-group--status">
					<label>Status:</label>
					<input
						id="newOrder-status"
						name="status"
						data-status='{{statuses|tojson}}'
					>
				</div>

				<div class="form-group form-group--fixed">
					<label id="newOrder-isDeliveryLabel" for="newOrder-isDelivery">Retirada</label>
					<div class="switch-container">
						<label class="switch">
							<input type="checkbox" id="newOrder-isDelivery" name="isDelivery" disabled onchange="toggleDeliveryModal(this, 'new')">
							<span class="switch-slider">
								<span class="switch-thumb">
									<span class="switch-thumb-icon switch-icon--off"></span>
									<span class="switch-thumb-icon switch-icon--on"></span>
								</span>
							</span>
						</label>
					</div>
				</div>

				<div class="form-group form-group--fixed" style="display: none;">
					<label><br></label>
					<button
						type="button"
						id="newOrder-editDetailsBtn"
						class="btn-edit-details"
						onclick="openEditDetailsModal('new')"
					>
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
							<path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
						</svg>
					</button>
				</div>
			</div>

			<label>Observações:</label>
			<textarea
				id="newOrder-obs"
				name="obs"
				rows="2"
				maxlength="2048"
			></textarea>
			
			<div class="modal-actions">
				<button
					type="button"
					id="newOrder-saveBtn"
					class="btn-modal btn-save push-right"
					disabled
					onclick="saveNewOrder()"
				>
					Salvar
				</button>
			</div>

		</form>
	</div>
</div>
