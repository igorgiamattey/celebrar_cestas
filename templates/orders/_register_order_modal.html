<div id="newOrder-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Registrar Pedido</h3>
			<button type="button" class="btn-close" onclick="closeModal('newOrder-modal')">&times;</button>
		</div>
		<form id="newOrder-form" method="post" action="{{url_for('orders_bp.new_order')}}">
			<input type="hidden" id="newOrder-items" name="items">
			<div class="client-row">
				<label>Cliente*:</label>
				<input
					id="newOrder-client"
					name="client"
					data-clients='{{available_clients|tojson}}'
					placeholder="Selecione um cliente..."
					oninput="
						refreshAddressOptions(this.value)
						toggleSaveButton(
							['newOrder-client', 'newOrder-orderPrice', 'newOrder-date'],
							'newOrder-saveBtn',
							[newOrderBaskets])"
				>
			</div>

			<div class="date-row">
				<div class="form-group">
					<label>Data do Pedido*:</label>
					<input
						id="newOrder-date"
						name="date"
						type="date"
						onkeydown="return false"
						max="{{ today }}"
						oninput="
						updateOrderDeliveryDate('new')
						toggleSaveButton(
							['newOrder-client', 'newOrder-orderPrice', 'newOrder-date'],
							'newOrder-saveBtn',
							[newOrderBaskets])"
					>
				</div>
				<div class="form-group">
					<label>Data de Entrega:</label>
					<input
						id="newOrder-deliveryDate"
						name="deliveryDate"
						type="date"
						onkeydown="return false"
					>
				</div>
			</div>

			<label>Adicionar Cesta*:</label>
			<div id="newOrder-addBasketRow" class="item-selection">
				<input
					id="newOrder-baskets"
					data-baskets='{{available_baskets|tojson}}'
					placeholder="Selecione uma cesta...">

				<input
					id="newOrder-basketQty"
					type="text"
					placeholder="Qtd"
					oninput="inputNumber(this)"
				>
				<button type="button" class="btn-modal btn-edit" onclick="addBasketToOrder('new')">
					+ Adicionar
				</button>
			</div>
			<div id="newOrder-basketList" class="order-items-list"></div>

			<div class="status-row">
				<div class="form-group form-group--fixed">
					<label>Valor do Pedido*:</label>
					<input
						id="newOrder-orderPrice"
						name="orderPrice"
						type="text"
						oninput="
							inputNumber(this)
							toggleSaveButton(
							['newOrder-client', 'newOrder-orderPrice', 'newOrder-date'],
							'newOrder-saveBtn',
							[newOrderBaskets])"
					>
				</div>

				<div class="form-group">
					<label>Status:</label>
					<input
						id="newOrder-status"
						name="status"
						data-status='{{statuses|tojson}}'
					>
				</div>

				<div class="form-group form-group--fixed">
					<label id="newOrder-isDeliveryLabel" for="newOrder-isDelivery">Retirada</label>
					<div class="switch-container">
						<label class="switch">
							<input type="checkbox" id="newOrder-isDelivery" name="isDelivery" onchange="toggleDeliveryModal(this)">
							<span class="switch-slider">
								<span class="switch-thumb">
									<span class="switch-thumb-icon switch-icon--off"></span>
									<span class="switch-thumb-icon switch-icon--on"></span>
								</span>
							</span>
						</label>
					</div>
				</div>
			</div>

			<label>Observações:</label>
			<textarea
				id="newOrder-obs"
				name="obs"
				rows="2"
				maxlength="2048"
			></textarea>
			
			<div class="modal-actions">
				<button
					type="button"
					id="newOrder-saveBtn"
					class="btn-modal btn-save push-right"
					disabled
					onclick="saveNewOrder()"
				>
					Salvar
				</button>
			</div>

		</form>
	</div>
</div>
