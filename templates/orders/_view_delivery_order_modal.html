<div id="view-deliveryOrder-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Detalhes da Entrega</h3>
			<button
				type="button"
				class="btn-close"
				onclick="cancelDeliveryDetails('view')"
			>
				&times;
			</button>
		</div>

		<div class="form-group">
			<label>Endereço*:</label>
			<input
				id="viewOrder-address"
				placeholder="Selecione um Endereço..."
			>
		</div>

		<div class="form-group" id="viewOrder-newAddressRow" style="display: none;">
			<label>Novo Endereço*:</label>
			<textarea
				id="viewOrder-newAddressText"
				name="viewAddressText"
				rows="4"
				maxlength="200"
			></textarea>
		</div>

		<div class="price-row">
			<div class="form-group">
				<label>Taxa de Entrega*:</label>
				<input
					id="viewOrder-deliveryFee"
					name="deliveryFee"
					type="text"
					oninput="inputPrice(this); updateOrderTotal('view')"
				>
			</div>

			<div class="form-group">
				<label>Total do Pedido:</label>
				<input
					id="viewOrder-totalPrice"
					name="totalPrice"
					type="text"
					disabled
				>
			</div>
		</div>
				
		<div class="modal-actions">
			<button
				type="button"
				class="btn-modal btn-save push-right"
				id="view-deliveryDetails-btn"
				onclick="confirmDeliveryDetails('view')"
			>
				Salvar
			</button>
		</div>		
	</div>
</div>
