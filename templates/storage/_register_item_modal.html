<div id="newItem-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Cadastrar Novo Item</h3>
			<button type="button" class="btn-close" onclick="closeModal('newItem-modal')">&times;</button>
		</div>
		<form id="newItem-form" method="post" action="{{url_for('storage_bp.new_item')}}">
			<label>Item*:</label>
			<input type="text" id="newItem-name" name="name" oninput="toggleSaveButton(['newItem-name','newItem-amount','newItem-unit','newItem-minimal','newItem-cost'], 'newItem-saveBtn')">
			
			<div class="quantity-row">
				<div class="form-group">
					<label>Quantidade*:</label>
					<input
						type="text"
						id="newItem-amount"
						inputmode="numeric"
						name="amount"
						oninput="
							inputNumber(this)
							toggleSaveButton(
								['newItem-name','newItem-amount',
								'newItem-unit','newItem-minimal',
								'newItem-cost'],
								'newItem-saveBtn')
							"
						>
				</div>
				
				<div class="form-group">
					<label>Quantidade para Alerta*:</label>
					<input type="text" id="newItem-minimal" name="minimal" oninput="inputNumber(this);toggleSaveButton(['newItem-name','newItem-amount','newItem-unit','newItem-minimal','newItem-cost'], 'newItem-saveBtn')">
				</div>
			</div>
			
			<div class="quantity-row">
				<div class="form-group">
					<label>Custo unitário*:</label>
					<input type="text" id="newItem-cost" name="cost" oninput="inputPrice(this);toggleSaveButton(['newItem-name','newItem-amount','newItem-unit','newItem-minimal','newItem-cost'], 'newItem-saveBtn')">
				</div>

				<div class="form-group">
					<label>Unidade de Medida*:</label>
					<select id="newItem-unit" name="unit" onchange="toggleSaveButton(['newItem-name','newItem-amount','newItem-unit','newItem-minimal','newItem-cost'], 'newItem-saveBtn')">
						<option value="">Selecione a unidade</option>
						{% for unit in units %}
						<option value="{{unit.id}}">{{unit.title}}</option>
						{% endfor %}
					</select>
				</div>
			</div>

			<div class="modal-actions">
				<button
					type="button"
					id="newItem-saveBtn"
					class="btn-modal btn-save push-right"
					disabled
					onclick="submitModal('newItem-form')"
				>
					Salvar
				</button>
			</div>

		</form>
	</div>
</div>
