<div id="viewItem-modal" class="modal-overlay" style="display: none;">
	<div class="modal-box">
		<div class="modal-header">
			<h3>Dados do Item</h3>
			<button type="button" class="btn-close" onclick="closeModal('viewItem-modal')">&times;</button>
		</div>
		<form id="viewItem-form" method="post" action="{{url_for('storage_bp.update_item')}}">
			<input type="hidden" id="viewItem-id" name="id">

			<label>Item*:</label>
			<input type="text" id="viewItem-name" name="name" placeholder="---" disabled oninput="toggleSaveButton(['viewItem-name','viewItem-amount','viewItem-unit','viewItem-minimal','viewItem-cost'], 'viewItem-saveBtn')">
			
			<div class="quantity-row">
				<div class="form-group">
					<label>Quantidade*:</label>
					<input type="text" id="viewItem-amount" name="amount" placeholder="---" readonly oninput="inputNumber(this);toggleSaveButton(['viewItem-name','viewItem-amount','viewItem-unit','viewItem-minimal','viewItem-cost'], 'viewItem-saveBtn')">
				</div>
				
				<div class="form-group">
					<label>Quantidade para Alerta*:</label>
					<input type="text" id="viewItem-minimal" name="minimal" placeholder="---" disabled oninput="inputNumber(this);toggleSaveButton(['viewItem-name','viewItem-amount','viewItem-unit','viewItem-minimal','viewItem-cost'], 'viewItem-saveBtn')">
				</div>
			</div>
			
			<div class="quantity-row">
				<div class="form-group">
					<label>Custo unitário*:</label>
					<input type="text" id="viewItem-cost" name="cost" placeholder="---" disabled oninput="inputNumber(this);toggleSaveButton(['viewItem-name','viewItem-amount','viewItem-unit','viewItem-minimal','viewItem-cost'], 'viewItem-saveBtn')">
				</div>

				<div class="form-group">
					<label>Unidade de Medida*:</label>
					<select id="viewItem-unit" name="unit" placeholder="---" disabled onchange="toggleSaveButton(['viewItem-name','viewItem-amount','viewItem-unit','viewItem-minimal','viewItem-cost'], 'viewItem-saveBtn')">
						<option value="">Selecione a unidade</option>
						{% for unit in units %}
						<option value="{{unit.id}}">{{unit.title}}</option>
						{% endfor %}
					</select>
				</div>
			</div>
			
			<div class="modal-actions">
				<div>
					<button type="button" class="btn-modal btn-delete" id="viewItem-deleteBtn" onclick="deleteItem()">Excluir</button>
				</div>
				<div>
					<button type="button" class="btn-modal btn-edit" id="viewItem-editBtn" onclick="enableEditItem()">Editar</button>
					<button type="button" class="btn-modal btn-save" id="viewItem-saveBtn" style="display: none;" disabled onclick="submitModal('viewItem-form')">Salvar</button>
					<button type="button" class="btn-modal btn-cancel" id="viewItem-cancelBtn" style="display: none;" onclick="cancelEditItem()">Cancelar</button>
				</div>
			</div>

		</form>
	</div>
</div>
